<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #d8d8d8; }
  .row { display: flex; gap: 16px; align-items: center; padding: 12px; }
  .light { background: #ffffff; }
  .dark { background: #1c1c1c; }
  img { display: block; }
</style>
<body>
  <div class="row light">
    <img src="favicon.svg" width="16" height="16">
    <img src="favicon.svg" width="32" height="32">
    <img src="favicon.svg" width="64" height="64">
  </div>
  <div class="row dark">
    <img src="favicon.svg" width="16" height="16">
    <img src="favicon.svg" width="32" height="32">
    <img src="favicon.svg" width="64" height="64">
  </div>
</body>
